name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint and build client
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build client
        run: npm run build

      - name: Security audit
        run: npm audit --audit-level moderate || echo "Security audit completed with warnings"

      - name: Check outdated dependencies
        run: npm outdated || echo "Dependency check completed"

      - name: Build size summary
        run: |
          echo "Build completed successfully"
          echo "Largest JavaScript bundles:"
          find dist/assets -name "*.js" -type f -exec ls -lh {} \; | sort -k5 -hr | head -5 || true
